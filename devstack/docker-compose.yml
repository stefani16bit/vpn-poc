# Compose project name. Without it Docker derives the project from the
# directory ("devstack"), which collides with the sibling projects on this
# machine that use the same layout.
name: poc-vpn

# What every exit node shares. Only one of them joins the canary network, and
# that asymmetry is the whole demonstration: the region a key was created in is
# what decides whether a private resource is reachable at all.
x-exit-node: &exit-node
  build: ./wireguard
  restart: unless-stopped
  # NET_ADMIN plus the tun device, never --privileged: this is the file
  # someone copies toward a real exit node. DEC-062.
  cap_add:
    - NET_ADMIN
  devices:
    - /dev/net/tun:/dev/net/tun
  sysctls:
    net.ipv4.ip_forward: '1'
    net.ipv4.conf.all.src_valid_mark: '1'
  healthcheck:
    test: ['CMD', '/healthcheck.sh']
    interval: 5s
    timeout: 3s
    retries: 10
    start_period: 10s

services:
  postgres:
    image: postgres:17-alpine
    container_name: poc-vpn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: poc_vpn_dev
    ports:
      - '${POSTGRES_PORT:-25432}:5432'
    volumes:
      # A named volume rather than a bind mount: initdb chmods PGDATA and
      # Docker Desktop's Windows bind mount refuses.
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 is load-bearing. During initdb the entrypoint runs a
      # temporary server bound to the unix socket only, so a socket probe
      # reports ready while the role script has not run yet.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d poc_vpn_dev']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    container_name: poc-vpn-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-26379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10

  verdaccio:
    image: verdaccio/verdaccio:6
    container_name: poc-vpn-verdaccio
    restart: unless-stopped
    ports:
      - '${VERDACCIO_PORT:-24873}:4873'
    volumes:
      - ./verdaccio/config.yaml:/verdaccio/conf/config.yaml:ro
      # A bind mount, unlike every other stateful service here. It is what lets
      # `reset` keep published packages for free - `down -v` cannot reach it -
      # instead of special-casing a volume name.
      - ./verdaccio/storage:/verdaccio/storage
    healthcheck:
      # node-on-alpine: the image ships neither curl nor wget, and node is the
      # one interpreter it is guaranteed to have.
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:4873/-/ping',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  localstack:
    image: localstack/localstack:4
    container_name: poc-vpn-localstack
    restart: unless-stopped
    environment:
      # Narrowed to what the adapters actually reach for. LocalStack eagerly
      # starts every service it is told about and is the largest memory
      # consumer in the stack.
      SERVICES: s3,sqs,sns,secretsmanager
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # Handed in so 01-resources.sh can seed the credential each node was
      # actually started with. One interpolation, consumed twice: the node and
      # the secret store cannot disagree.
      EXIT_NODE_API_TOKEN_SA: ${EXIT_NODE_API_TOKEN_SA:-exit_node_dev_sa_1f4a9c2e8b7d6053a1c9e4f2b8d7a601}
      EXIT_NODE_API_TOKEN_NA: ${EXIT_NODE_API_TOKEN_NA:-exit_node_dev_na_7c2e91b4f8a6d3095e1b7c4a2f8d6053}
      EXIT_NODE_API_TOKEN_EU: ${EXIT_NODE_API_TOKEN_EU:-exit_node_dev_eu_3b8d1f6a4c9e2705d8b3a1f6c4e97052}
      EXIT_NODE_API_TOKEN_AS: ${EXIT_NODE_API_TOKEN_AS:-exit_node_dev_as_9e4c7a2f1b8d6503c9a4e7b2f1d86045}
      EXIT_NODE_API_TOKEN_AF: ${EXIT_NODE_API_TOKEN_AF:-exit_node_dev_af_5d1a8f3c6b9e2074a5d1c8f3b6e29047}
      EXIT_NODE_API_TOKEN_PREVIOUS_SA: ${EXIT_NODE_API_TOKEN_PREVIOUS_SA:-exit_node_dev_sa_prev_8a3f1c6e2b9d7054f3a8c1e6b2d97401}
      EXIT_NODE_API_TOKEN_PREVIOUS_NA: ${EXIT_NODE_API_TOKEN_PREVIOUS_NA:-exit_node_dev_na_prev_2d7b9e4a1f6c8305b7d2e9a4c1f68530}
      EXIT_NODE_API_TOKEN_PREVIOUS_EU: ${EXIT_NODE_API_TOKEN_PREVIOUS_EU:-exit_node_dev_eu_prev_6c1e8b3d9a4f7025e6c1b8d3a9f42706}
      EXIT_NODE_API_TOKEN_PREVIOUS_AS: ${EXIT_NODE_API_TOKEN_PREVIOUS_AS:-exit_node_dev_as_prev_4f8a2d7c1e9b6503a4f8c2d7e1b96054}
      EXIT_NODE_API_TOKEN_PREVIOUS_AF: ${EXIT_NODE_API_TOKEN_PREVIOUS_AF:-exit_node_dev_af_prev_9b4d6f1a3c8e2075d9b4a6f1c3e82740}
      # The signing secret is a secret here and nowhere else: the API reads it
      # through AUTH_JWT_SECRET_REF, never from its own environment. Two values
      # because the devstack keeps a rotation window standing open. DEC-101.
      AUTH_JWT_SECRET_CURRENT: ${AUTH_JWT_SECRET_CURRENT:-auth_jwt_dev_current_6f2c8a41e9b7d350c8f1a6b4e2d97053}
      AUTH_JWT_SECRET_PREVIOUS: ${AUTH_JWT_SECRET_PREVIOUS:-auth_jwt_dev_previous_4b9e1d76c3a805f2e7b4d1c9a6f30528}
      STRIPE_WEBHOOK_SECRET_FIXTURE: ${STRIPE_WEBHOOK_SECRET_FIXTURE:-whsec_dev_fixture_not_a_real_endpoint_secret}
    ports:
      - '${LOCALSTACK_PORT:-24566}:4566'
    volumes:
      - ./localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:4566/_localstack/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  localstripe:
    image: adrienverge/localstripe:latest
    container_name: poc-vpn-localstripe
    restart: unless-stopped
    ports:
      - '${LOCALSTRIPE_PORT:-28420}:8420'
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf -u sk_test_local: http://localhost:8420/v1/customers || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.22.3
    container_name: poc-vpn-mailpit
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-21025}:1025'
      - '${MAILPIT_UI_PORT:-28025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2.9-alpine
    container_name: poc-vpn-caddy
    restart: unless-stopped
    ports:
      - '${CADDY_HTTP_PORT:-20080}:80'
      - '${CADDY_HTTPS_PORT:-20443}:443'
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # The internal CA lives here. Losing it on every restart would make the
      # browser re-warn about an untrusted certificate each time.
      - caddy-data:/data
      - caddy-config:/config
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:2019/config/']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One service per demonstrated region. Five copies of the same anchor and not
  # a template with substitution: this file is what somebody copies toward a
  # real exit node, and the only things that differ per node are exactly the
  # five the fleet cannot share — its name, its two ports, its wireguard key,
  # its range, and the credential its control plane demands. DEC-062, DEC-073.
  wireguard-sa:
    <<: *exit-node
    container_name: poc-vpn-wireguard-sa
    environment:
      EXIT_NODE_API_TOKEN: ${EXIT_NODE_API_TOKEN_SA:-exit_node_dev_sa_1f4a9c2e8b7d6053a1c9e4f2b8d7a601}
      EXIT_NODE_API_TOKEN_PREVIOUS: ${EXIT_NODE_API_TOKEN_PREVIOUS_SA:-exit_node_dev_sa_prev_8a3f1c6e2b9d7054f3a8c1e6b2d97401}
    networks:
      # `default` is listed because declaring this key at all stops the service
      # from joining it implicitly, and the symptom would be every other
      # container losing the node rather than the canary failing. DEC-075.
      default:
      canary:
        ipv4_address: 172.30.13.2
    ports:
      - '${WIREGUARD_PORT_SA:-21820}:51820/udp'
      - '${EXIT_NODE_API_PORT_SA:-21821}:51821'
    volumes:
      # Bind mount rather than COPY: `reload s=wireguard-sa` then re-reads the
      # peer list, which is what makes the NAT probe in the spec runnable.
      - ./wireguard/nodes/sa.conf:/etc/wireguard/wg0.conf:ro
      # Not mounted onto /srv/control, which the image already fills: the
      # entrypoint copies this in and sets the execute bit on its own side.
      # Serving the mount directly would depend on the host's file mode. DEC-089.
      - ./wireguard/control:/srv/control-src:ro

  wireguard-na:
    <<: *exit-node
    container_name: poc-vpn-wireguard-na
    environment:
      EXIT_NODE_API_TOKEN: ${EXIT_NODE_API_TOKEN_NA:-exit_node_dev_na_7c2e91b4f8a6d3095e1b7c4a2f8d6053}
      EXIT_NODE_API_TOKEN_PREVIOUS: ${EXIT_NODE_API_TOKEN_PREVIOUS_NA:-exit_node_dev_na_prev_2d7b9e4a1f6c8305b7d2e9a4c1f68530}
    ports:
      - '${WIREGUARD_PORT_NA:-21830}:51820/udp'
      - '${EXIT_NODE_API_PORT_NA:-21831}:51821'
    volumes:
      - ./wireguard/nodes/na.conf:/etc/wireguard/wg0.conf:ro
      - ./wireguard/control:/srv/control-src:ro

  wireguard-eu:
    <<: *exit-node
    container_name: poc-vpn-wireguard-eu
    environment:
      EXIT_NODE_API_TOKEN: ${EXIT_NODE_API_TOKEN_EU:-exit_node_dev_eu_3b8d1f6a4c9e2705d8b3a1f6c4e97052}
      EXIT_NODE_API_TOKEN_PREVIOUS: ${EXIT_NODE_API_TOKEN_PREVIOUS_EU:-exit_node_dev_eu_prev_6c1e8b3d9a4f7025e6c1b8d3a9f42706}
    ports:
      - '${WIREGUARD_PORT_EU:-21840}:51820/udp'
      - '${EXIT_NODE_API_PORT_EU:-21841}:51821'
    volumes:
      - ./wireguard/nodes/eu.conf:/etc/wireguard/wg0.conf:ro
      - ./wireguard/control:/srv/control-src:ro

  wireguard-as:
    <<: *exit-node
    container_name: poc-vpn-wireguard-as
    environment:
      EXIT_NODE_API_TOKEN: ${EXIT_NODE_API_TOKEN_AS:-exit_node_dev_as_9e4c7a2f1b8d6503c9a4e7b2f1d86045}
      EXIT_NODE_API_TOKEN_PREVIOUS: ${EXIT_NODE_API_TOKEN_PREVIOUS_AS:-exit_node_dev_as_prev_4f8a2d7c1e9b6503a4f8c2d7e1b96054}
    ports:
      - '${WIREGUARD_PORT_AS:-21850}:51820/udp'
      - '${EXIT_NODE_API_PORT_AS:-21851}:51821'
    volumes:
      - ./wireguard/nodes/as.conf:/etc/wireguard/wg0.conf:ro
      - ./wireguard/control:/srv/control-src:ro

  wireguard-af:
    <<: *exit-node
    container_name: poc-vpn-wireguard-af
    environment:
      EXIT_NODE_API_TOKEN: ${EXIT_NODE_API_TOKEN_AF:-exit_node_dev_af_5d1a8f3c6b9e2074a5d1c8f3b6e29047}
      EXIT_NODE_API_TOKEN_PREVIOUS: ${EXIT_NODE_API_TOKEN_PREVIOUS_AF:-exit_node_dev_af_prev_9b4d6f1a3c8e2075d9b4a6f1c3e82740}
    ports:
      - '${WIREGUARD_PORT_AF:-21860}:51820/udp'
      - '${EXIT_NODE_API_PORT_AF:-21861}:51821'
    volumes:
      - ./wireguard/nodes/af.conf:/etc/wireguard/wg0.conf:ro
      - ./wireguard/control:/srv/control-src:ro

networks:
  # Declared here and consumed as `external` by poc-vpn-canary, so that `make up`
  # works on a machine that has never heard of that repository. The subnet is
  # pinned because a proof whose target has to be discovered before every run is
  # not an assertion. DEC-075.
  canary:
    name: poc-vpn-canary
    ipam:
      config:
        - subnet: 172.30.13.0/24

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
